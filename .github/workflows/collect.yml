name: collect

# Every 15 minutes from 6am to 5:45pm Eastern (11:00-22:45 UTC in winter), plus hourly
# overnight for the lit snow stakes. GitHub may delay scheduled runs by a few minutes.
on:
  schedule:
    - cron: "*/15 11-22 * * *"
    - cron: "0 0-10,23 * * *"
  workflow_dispatch: {}

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Restore database from the data branch
        run: |
          git fetch origin data:data 2>/dev/null || true
          mkdir -p data
          if git show-ref --quiet refs/heads/data; then
            git show data:snowcam.db > data/snowcam.db || true
            git show data:offline_hashes.txt > data/offline_hashes.txt 2>/dev/null || true
            git archive data refs 2>/dev/null | tar -x -C data 2>/dev/null || true
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect, gate, read, fuse
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m snowcam.cli collect
          if [ -n "$ANTHROPIC_API_KEY" ]; then python -m snowcam.cli read --since-hours 0.5; fi
          python -m snowcam.cli fuse
          python -m snowcam.cli report

      - name: Upload this pass's frames (private, 30 days)
        uses: actions/upload-artifact@v4
        with:
          name: frames-${{ github.run_id }}
          path: |
            data/frames
            data/report.html
          retention-days: 30

      - name: Save database to the data branch
        run: |
          git config user.name "snowcam-bot"
          git config user.email "snowcam-bot@users.noreply.github.com"
          tmp=$(mktemp -d)
          cp data/snowcam.db "$tmp/"
          [ -d data/refs ] && cp -r data/refs "$tmp/" || true
          [ -f data/offline_hashes.txt ] && cp data/offline_hashes.txt "$tmp/" || true
          git checkout --orphan data-new
          git rm -rf --quiet . || true
          cp -r "$tmp"/. .
          git add -A
          git commit -qm "data $(date -u +%FT%TZ)"
          git push -f origin data-new:data
