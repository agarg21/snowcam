name: collect

# Hourly from 7am to 4pm Eastern (12:00-21:00 UTC in winter), plus three overnight passes for
# the lit snow stakes (10pm, 2am, 5am ET): about 13 runs a day, sized for 33 resorts inside the
# 2,000 free Actions minutes of a private repo. GitHub may delay or drop scheduled runs.
on:
  schedule:
    - cron: "17 12-21 * * *"
    - cron: "17 3,7,10 * * *"
  workflow_dispatch: {}

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # to start the daily health check after the last daytime pass

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Restore database from the data branch
        run: |
          git fetch origin data:data 2>/dev/null || true
          mkdir -p data
          if git show-ref --quiet refs/heads/data; then
            git show data:snowcam.db > data/snowcam.db || true
            git show data:offline_hashes.txt > data/offline_hashes.txt 2>/dev/null || true
            git archive data refs 2>/dev/null | tar -x -C data 2>/dev/null || true
            git archive data last 2>/dev/null | tar -x -C data 2>/dev/null || true
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect, gate, read, fuse
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m snowcam.cli collect
          python -m snowcam.cli reference-missing
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            python -m snowcam.cli describe-new
            python -m snowcam.cli read --since-hours 0.5
            python -m snowcam.cli verify
          fi
          python -m snowcam.cli check-publish
          python -m snowcam.cli fuse
          python -m snowcam.cli report
          python -m snowcam.cli savings || true

      # Private dataset (owner, 2026-11-25): this pass's daytime reads as 640 px JPEGs with label
      # JSON, one part zip per pass. Never part of the public feed.
      - name: Archive this pass's daytime reads
        if: always()
        continue-on-error: true
        run: python -m snowcam.cli archive --since-hours 0.5 --tag "${{ github.run_id }}"

      - name: Upload this pass's frames (private, 30 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frames-${{ github.run_id }}
          path: |
            data/frames
            data/report.html
            data/archive
          retention-days: 30

      # Only the database, reference frames and each cam's last read frame go to the data
      # branch (one commit, replaced every run). Raw frames stay in the run artifact above.
      - name: Save database to the data branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tmp=$(mktemp -d)
          cp data/snowcam.db "$tmp/"
          [ -d data/refs ] && cp -r data/refs "$tmp/" || true
          [ -d data/last ] && cp -r data/last "$tmp/" || true
          [ -f data/offline_hashes.txt ] && cp data/offline_hashes.txt "$tmp/" || true
          cd "$tmp"
          git init -q -b data
          git config user.name "snowcam-bot"
          git config user.email "snowcam-bot@users.noreply.github.com"
          git add -A
          git commit -qm "data $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" data:data

      # Text-only feed for the Family Tripwise resort pages (owner D47/D48). Needs the FEED_TOKEN
      # secret: a fine-grained token with Contents read/write on agarg21/snowcam-feed only.
      - name: Publish the text feed
        if: always()
        env:
          FEED_TOKEN: ${{ secrets.FEED_TOKEN }}
        run: |
          if [ -z "$FEED_TOKEN" ]; then echo "FEED_TOKEN not set; feed not published"; exit 0; fi
          python -m snowcam.cli export-feed --out "$RUNNER_TEMP/conditions.json"
          d=$(mktemp -d)
          git clone -q --depth 1 "https://x-access-token:${FEED_TOKEN}@github.com/agarg21/snowcam-feed.git" "$d"
          cp "$RUNNER_TEMP/conditions.json" "$d/conditions.json"
          cd "$d"
          git config user.name "snowcam-bot"
          git config user.email "snowcam-bot@users.noreply.github.com"
          git add conditions.json
          git diff --cached --quiet || { git commit -qm "conditions $(date -u +%FT%TZ)"; git push -q origin HEAD; }

      # Part zips go to the day's release in the private repo agarg21/snowcam-lab; the first pass
      # after midnight Eastern merges each earlier day's parts into snowcam-<day>.zip with a
      # manifest.csv. Needs a token with Contents read/write on snowcam-lab: LAB_TOKEN, or
      # FEED_TOKEN when that token is also given snowcam-lab. If neither works the parts stay in
      # this run's artifact for 30 days.
      - name: Upload archive to snowcam-lab
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.LAB_TOKEN || secrets.FEED_TOKEN }}
          LAB: agarg21/snowcam-lab
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "no token for $LAB; archive kept in the run artifact"; exit 0; fi
          if ! gh api "repos/$LAB" --jq .private >/dev/null 2>&1; then
            echo "token cannot reach $LAB yet; archive kept in the run artifact"; exit 0
          fi
          # A release needs a commit to tag; seed an empty repo with a README once.
          if ! gh api "repos/$LAB/commits?per_page=1" >/dev/null 2>&1; then
            gh api -X PUT "repos/$LAB/contents/README.md" -f message="Start the snow cam frame archive" \
              -f content="$(printf '# Snow cam frames (private)\n\nDaily zips of daytime frames and label JSON, attached to releases. Working data only; not for redistribution.\n' | base64 -w0)" >/dev/null \
              && echo "seeded $LAB with a README"
          fi
          shopt -s nullglob
          for z in data/archive/*.zip; do
            day=$(basename "$z" | sed -E 's/^snowcam-([0-9-]+)-part-.*/\1/')
            tag="day-$day"
            gh release view "$tag" -R "$LAB" >/dev/null 2>&1 || \
              gh release create "$tag" -R "$LAB" --title "Snow cam frames $day (US Eastern day)" \
                --notes "Daytime frames read by the snowcam reader on $day: 640 px JPEGs with label JSON (teacher fields with confidences, second-reader check when there is one). Parts are merged into snowcam-$day.zip the next morning."
            gh release upload "$tag" "$z" -R "$LAB" --clobber && echo "uploaded $(basename "$z") to $tag"
          done
          today=$(TZ=America/New_York date +%F)
          for tag in $(gh release list -R "$LAB" --limit 40 --json tagName --jq '.[].tagName'); do
            day=${tag#day-}
            [[ "$day" < "$today" ]] || continue
            parts=$(gh release view "$tag" -R "$LAB" --json assets --jq '.assets[].name | select(contains("-part-"))')
            [ -n "$parts" ] || continue
            d=$(mktemp -d)
            gh release download "$tag" -R "$LAB" -p "snowcam-$day*.zip" -D "$d"
            python -m snowcam.cli archive-merge "$RUNNER_TEMP/snowcam-$day.zip" "$d"/*.zip
            gh release upload "$tag" "$RUNNER_TEMP/snowcam-$day.zip" -R "$LAB" --clobber
            for a in $parts; do gh release delete-asset "$tag" "$a" -R "$LAB" -y; done
            echo "merged $tag"
          done

      # GitHub's cron skipped health.yml on its first night (11-25), so the last daytime pass
      # also starts it. Running twice only rewrites the same issue.
      - name: Start the daily health check after the last daytime pass
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H)" = "21" ]; then gh workflow run health.yml -R "$GITHUB_REPOSITORY" || true; fi
