name: collect

# Hourly from 7am to 4pm Eastern (12:00-21:00 UTC in winter), plus three overnight passes for
# the lit snow stakes (10pm, 2am, 5am ET): about 13 runs a day, sized for 33 resorts inside the
# 2,000 free Actions minutes of a private repo. GitHub may delay or drop scheduled runs.
on:
  schedule:
    - cron: "17 12-21 * * *"
    - cron: "17 3,7,10 * * *"
  workflow_dispatch: {}

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Restore database from the data branch
        run: |
          git fetch origin data:data 2>/dev/null || true
          mkdir -p data
          if git show-ref --quiet refs/heads/data; then
            git show data:snowcam.db > data/snowcam.db || true
            git show data:offline_hashes.txt > data/offline_hashes.txt 2>/dev/null || true
            git archive data refs 2>/dev/null | tar -x -C data 2>/dev/null || true
            git archive data last 2>/dev/null | tar -x -C data 2>/dev/null || true
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect, gate, read, fuse
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m snowcam.cli collect
          python -m snowcam.cli reference-missing
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            python -m snowcam.cli describe-new
            python -m snowcam.cli read --since-hours 0.5
          fi
          python -m snowcam.cli fuse
          python -m snowcam.cli report

      - name: Upload this pass's frames (private, 30 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frames-${{ github.run_id }}
          path: |
            data/frames
            data/report.html
          retention-days: 30

      # Only the database, reference frames and each cam's last read frame go to the data
      # branch (one commit, replaced every run). Raw frames stay in the run artifact above.
      - name: Save database to the data branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tmp=$(mktemp -d)
          cp data/snowcam.db "$tmp/"
          [ -d data/refs ] && cp -r data/refs "$tmp/" || true
          [ -d data/last ] && cp -r data/last "$tmp/" || true
          [ -f data/offline_hashes.txt ] && cp data/offline_hashes.txt "$tmp/" || true
          cd "$tmp"
          git init -q -b data
          git config user.name "snowcam-bot"
          git config user.email "snowcam-bot@users.noreply.github.com"
          git add -A
          git commit -qm "data $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" data:data

      # Text-only feed for the Family Tripwise resort pages (owner D47/D48). Needs the FEED_TOKEN
      # secret: a fine-grained token with Contents read/write on agarg21/snowcam-feed only.
      - name: Publish the text feed
        if: always()
        env:
          FEED_TOKEN: ${{ secrets.FEED_TOKEN }}
        run: |
          if [ -z "$FEED_TOKEN" ]; then echo "FEED_TOKEN not set; feed not published"; exit 0; fi
          python -m snowcam.cli export-feed --out "$RUNNER_TEMP/conditions.json"
          d=$(mktemp -d)
          git clone -q --depth 1 "https://x-access-token:${FEED_TOKEN}@github.com/agarg21/snowcam-feed.git" "$d"
          cp "$RUNNER_TEMP/conditions.json" "$d/conditions.json"
          cd "$d"
          git config user.name "snowcam-bot"
          git config user.email "snowcam-bot@users.noreply.github.com"
          git add conditions.json
          git diff --cached --quiet || { git commit -qm "conditions $(date -u +%FT%TZ)"; git push -q origin HEAD; }
