name: health

# Daily health check after the last daytime pass (owner, 2026-11-25: an operating protocol for
# recurring issues). No model calls: it reads the database on the data branch and the run list,
# then keeps one open issue labelled "health" up to date, and closes it when everything is clear.
on:
  schedule:
    - cron: "43 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore database from the data branch
        run: |
          git fetch origin data:data
          mkdir -p data
          git show data:snowcam.db > data/snowcam.db

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check
        run: |
          gh run list -R "$GITHUB_REPOSITORY" -w collect.yml -L 60 \
            --json conclusion,createdAt,databaseId,event,url > runs.json
          gh label create health -R "$GITHUB_REPOSITORY" -c B60205 -d "Daily snowcam health check" 2>/dev/null || true
          num=$(gh issue list -R "$GITHUB_REPOSITORY" -l health -s open --json number -q '.[0].number')
          [ -n "$num" ] && gh issue view "$num" -R "$GITHUB_REPOSITORY" --json body -q .body > previous.md || true
          python -m snowcam.cli health --runs runs.json --previous previous.md --out health.md
          if grep -q '^All clear\.' health.md; then
            [ -n "$num" ] && gh issue close "$num" -R "$GITHUB_REPOSITORY" -c "$(cat health.md)" || true
          elif [ -n "$num" ]; then
            gh issue edit "$num" -R "$GITHUB_REPOSITORY" --body-file health.md
            # A comment (which notifies) only when something new turned up.
            if grep -q '(new)' health.md; then
              gh issue comment "$num" -R "$GITHUB_REPOSITORY" -b "New today: $(grep '(new)' health.md | sed 's/ \*\*(new)\*\*//' | tr '\n' ' ')"
            fi
          else
            gh issue create -R "$GITHUB_REPOSITORY" -l health -t "Snowcam health" --body-file health.md
          fi
