# Cam registry: one entry per cam. Adding a resort = adding config here.
#
# feed types:
#   brownrice  - public snapshot endpoint https://player.brownrice.com/snapshot/<stream>
#   still      - any direct JPEG/PNG URL (url: ...)
#   hls        - an .m3u8 playlist (url: ...); grabs a 3-frame burst with ffmpeg
#
# roles decide which fields the reader is asked for:
#   summit, trail -> snow + visibility
#   base          -> busyness, lifts, lines
#   stake         -> snow stake reading (works at night when lit)
#   tubing, road  -> later
#
# night_ok: read this cam even when the sun is down (lit snow stakes)
#
# Excluded for now (see design doc): Camelback and Blue Mountain (WetMet streams locked
# to the resorts' own sites), Belleayre (site refuses automated access), Jack Frost (offline).

defaults:
  poll_minutes: 15
  user_agent: "snowcam/0.1 (research prototype; contact via repo)"

resorts:
  hunter:
    name: Hunter Mountain
    state: NY
    lat: 42.2017
    lon: -74.2251
    tz: America/New_York
    cam_page: https://www.huntermtn.com/the-mountain/mountain-conditions/mountain-cams.aspx
    cams:
      - id: hunter-base
        name: Base Area
        feed: brownrice
        stream: hunter1
        role: base
        describe: "Base plaza with a flagpole, picnic tables and stone steps; beginner lifts and the lower slopes behind."
      - id: hunter-mid
        name: Midstation
        feed: brownrice
        stream: huntermidstation
        role: trail
        describe: "Mid-mountain view partly blocked by a tree trunk at left and leaves at top (daytime view not yet seen; feed was frozen on Nov 11)."
      - id: hunter-east
        name: Hunter East
        feed: brownrice
        stream: hunternorthside
        role: trail
        describe: "Chairlift tower and chairs close in the foreground over a lower slope; ridgeline and trees behind."
      - id: hunter-summit
        name: Summit
        feed: brownrice
        stream: huntersummit
        role: summit
        describe: "Summit looking down a chairlift line over the valley to distant ridges."

  mount-snow:
    name: Mount Snow
    state: VT
    lat: 42.9601
    lon: -72.9204
    tz: America/New_York
    cam_page: https://www.mountsnow.com/the-mountain/mountain-conditions/mountain-cams.aspx
    cams:
      - id: mountsnow-stake
        name: Snow Stake
        feed: brownrice
        stream: mountsnowsnowstake
        role: stake
        night_ok: false   # the board is not lit at night (Nov 14: IR noise only)
        describe: "Snow stake board marked 1-26 in. beside an analog clock and a dial thermometer, set in woods."
      - id: mountsnow-summit
        name: Summit
        feed: brownrice
        stream: mountsnowsummit
        role: summit
        describe: "Upper trail crossed by a snowmaking pipe with blue fan guns and a lift line; evergreens beyond. Often in cloud."
      - id: mountsnow-somerset
        name: Somerset
        feed: brownrice
        stream: mountsnowsomerset
        role: trail
        describe: "From the top of a chairlift looking over Somerset Reservoir; the lift line drops away at right."
      - id: mountsnow-carinthia
        name: Carinthia
        feed: brownrice
        stream: mountsnowcarinthia
        role: trail
        describe: "Looking up a Carinthia slope with a chairlift running up it and the lift terminal at right; snowmaking towers on the ridge."
      - id: mountsnow-base
        name: Main Base Area
        feed: brownrice
        stream: mountsnowbase
        role: base
        describe: "Bottom terminal of the Grand Summit Express (#11) at left with corral mazes; a trail climbs behind."

  okemo:
    name: Okemo
    state: VT
    lat: 43.4015
    lon: -72.7171
    tz: America/New_York
    cam_page: https://www.okemo.com/the-mountain/mountain-conditions/mountain-cams.aspx
    cams:
      - id: okemo-stake
        name: Snow Stake
        feed: brownrice
        stream: okemosnowstake
        role: stake
        night_ok: true
        crop: [0.50, 0.12, 0.72, 0.92]
        describe: "Snow stake ruler (0-24 in.) on a white board inside a wooden fence; red display alternates the time and the temperature."
      - id: okemo-summit
        name: Summit
        feed: brownrice
        stream: okemosummit
        role: summit
        describe: "Summit with a lift line and small hut, looking out over the valley to distant peaks."
      - id: okemo-sugarhouse
        name: Sugar House
        feed: brownrice
        stream: okemosugarhouse
        role: trail
        describe: "Lower slope with a curving groomed road across it; trees and houses at the far edge. No lodge or lift in view."
      - id: okemo-roundhouse
        name: Roundhouse
        feed: brownrice
        stream: okemoroundhouse
        role: base
        describe: "Coleman Brook base: small buildings and a chairlift running up a slope."

  windham:
    name: Windham Mountain Club
    state: NY
    lat: 42.2943
    lon: -74.2563
    tz: America/New_York
    cam_page: https://www.windhammountainclub.com/mountain-cam/
    cams:
      - id: windham-base
        name: Base
        feed: brownrice
        stream: windhammountainclub
        role: base
        describe: "Looking up from behind the base lodge roofs at lift terminals and trails on the mountain."
